<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERT AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #050505;
  color: white;
  font-family: Arial, sans-serif;
  height: 100vh;
}

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  padding: 18px;
  text-align: center;
  font-size: 25px;
  font-weight: bold;
  border-bottom: 1px solid #222;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 800px;
  margin: 0 auto 15px;
  padding: 14px 16px;
  border-radius: 14px;
  white-space: pre-wrap;
  line-height: 1.5;
}

.user {
  background: #202020;
}

.ai {
  background: #101010;
  border: 1px solid #222;
}

.input-area {
  display: flex;
  gap: 10px;
  padding: 12px;
  border-top: 1px solid #222;
}

#messageInput {
  flex: 1;
  padding: 14px;
  border-radius: 12px;
  border: 1px solid #333;
  background: #111;
  color: white;
  font-size: 16px;
  outline: none;
}

#sendButton {
  padding: 0 20px;
  border: none;
  border-radius: 12px;
  background: white;
  color: black;
  font-weight: bold;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    🤖 MERT AI
  </div>

  <div id="messages" class="messages">
    <div class="message ai">
      Merhaba! Ben MERT AI 🤖<br>
      Sana nasıl yardımcı olabilirim?
    </div>
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="MERT AI'ya bir şey sor..."
    >

    <button id="sendButton" onclick="sendMessage()">
      Gönder
    </button>
  </div>

</div>

<script>
const WORKER_URL =
  "https://mert-ai.j28jyc9rjt.workers.dev";

async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const messages =
    document.getElementById("messages");

  const button =
    document.getElementById("sendButton");

  const message =
    input.value.trim();

  if (!message) return;

  const userMessage =
    document.createElement("div");

  userMessage.className =
    "message user";

  userMessage.textContent =
    message;

  messages.appendChild(userMessage);

  input.value = "";

  button.disabled = true;
  button.textContent = "⏳";

  const aiMessage =
    document.createElement("div");

  aiMessage.className =
    "message ai";

  aiMessage.textContent =
    "Düşünüyorum...";

  messages.appendChild(aiMessage);

  messages.scrollTop =
    messages.scrollHeight;

  try {

    const response =
      await fetch(WORKER_URL, {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      });

    const data =
      await response.json();

    aiMessage.textContent =
      data.answer ||
      "Cevap alınamadı.";

  } catch (error) {

    aiMessage.textContent =
      "Bağlantı hatası oluştu.";

  }

  button.disabled = false;
  button.textContent = "Gönder";

  messages.scrollTop =
    messages.scrollHeight;
}

document
  .getElementById("messageInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  });
</script>

</body>
</html>
