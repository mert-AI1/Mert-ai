<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERT AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #000;
  color: white;
  height: 100vh;
  overflow: hidden;
}

.app {
  display: flex;
  height: 100vh;
}

.sidebar {
  width: 260px;
  background: #080808;
  border-right: 1px solid #222;
  padding: 15px;
  overflow-y: auto;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  text-align: center;
  margin-bottom: 18px;
  letter-spacing: 2px;
}

.new-chat {
  width: 100%;
  padding: 13px;
  border: 1px solid #333;
  border-radius: 12px;
  background: #151515;
  color: white;
  font-size: 15px;
  cursor: pointer;
  margin-bottom: 15px;
}

.new-chat:hover {
  background: #222;
}

.chat-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.chat-item {
  padding: 11px;
  background: #111;
  border: 1px solid #222;
  border-radius: 10px;
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  gap: 8px;
}

.chat-item:hover {
  background: #1b1b1b;
}

.chat-title {
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.delete-chat {
  border: none;
  background: transparent;
  color: #888;
  cursor: pointer;
}

.delete-chat:hover {
  color: red;
}

.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-width: 0;
}

.header {
  padding: 18px;
  border-bottom: 1px solid #222;
  font-size: 22px;
  font-weight: bold;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  max-width: 800px;
  margin: 0 auto 15px;
  padding: 14px 16px;
  border-radius: 15px;
  line-height: 1.5;
  white-space: pre-wrap;
}

.user {
  background: #202020;
}

.ai {
  background: #0d0d0d;
  border: 1px solid #222;
}

.input-area {
  padding: 15px;
  border-top: 1px solid #222;
  display: flex;
  gap: 10px;
}

#messageInput {
  flex: 1;
  background: #111;
  color: white;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 14px;
  font-size: 16px;
  outline: none;
}

#sendButton {
  background: white;
  color: black;
  border: none;
  border-radius: 14px;
  padding: 0 20px;
  font-size: 16px;
  cursor: pointer;
}

#sendButton:disabled {
  opacity: .5;
}

.empty {
  text-align: center;
  color: #777;
  margin-top: 80px;
}

@media (max-width: 700px) {
  .sidebar {
    width: 190px;
    padding: 10px;
  }

  .logo {
    font-size: 20px;
  }

  .messages {
    padding: 12px;
  }

  .input-area {
    padding: 10px;
  }
}
</style>
</head>

<body>

<div class="app">

  <aside class="sidebar">
    <div class="logo">MERT AI</div>

    <button class="new-chat" onclick="newChat()">
      ➕ Yeni Sohbet
    </button>

    <div id="chatList" class="chat-list"></div>
  </aside>

  <main class="main">

    <div class="header">
      🤖 MERT AI
    </div>

    <div id="messages" class="messages"></div>

    <div class="input-area">
      <input
        id="messageInput"
        type="text"
        placeholder="MERT AI'ya bir şey sor..."
        autocomplete="off"
      >

      <button id="sendButton" onclick="sendMessage()">
        Gönder
      </button>
    </div>

  </main>

</div>

<script>

const WORKER_URL =
  "https://mert-ai.j28jyc9rjt.workers.dev";

let chats =
  JSON.parse(localStorage.getItem("mertAI_chats") || "[]");

let currentChatId =
  localStorage.getItem("mertAI_currentChat");

function saveChats() {
  localStorage.setItem(
    "mertAI_chats",
    JSON.stringify(chats)
  );
}

function createFirstChat() {

  if (chats.length === 0) {

    const chat = {
      id: Date.now(),
      title: "Yeni Sohbet",
      messages: []
    };

    chats.push(chat);
    currentChatId = chat.id;

    saveChats();

  } else if (!currentChatId) {

    currentChatId = chats[0].id;

    localStorage.setItem(
      "mertAI_currentChat",
      currentChatId
    );
  }
}

function getCurrentChat() {

  return chats.find(
    chat => String(chat.id) === String(currentChatId)
  );
}

function newChat() {

  const chat = {
    id: Date.now(),
    title: "Yeni Sohbet",
    messages: []
  };

  chats.unshift(chat);

  currentChatId = chat.id;

  saveChats();

  localStorage.setItem(
    "mertAI_currentChat",
    currentChatId
  );

  renderChatList();
  renderMessages();
}

function deleteChat(id, event) {

  event.stopPropagation();

  chats = chats.filter(
    chat => String(chat.id) !== String(id)
  );

  if (chats.length === 0) {

    const chat = {
      id: Date.now(),
      title: "Yeni Sohbet",
      messages: []
    };

    chats.push(chat);
  }

  currentChatId = chats[0].id;

  saveChats();

  localStorage.setItem(
    "mertAI_currentChat",
    currentChatId
  );

  renderChatList();
  renderMessages();
}

function openChat(id) {

  currentChatId = id;

  localStorage.setItem(
    "mertAI_currentChat",
    currentChatId
  );

  renderChatList();
  renderMessages();
}

function renderChatList() {

  const list =
    document.getElementById("chatList");

  list.innerHTML = "";

  chats.forEach(chat => {

    const item =
      document.createElement("div");

    item.className = "chat-item";

    item.onclick = () =>
      openChat(chat.id);

    const title =
      document.createElement("div");

    title.className = "chat-title";

    title.textContent =
      chat.title || "Yeni Sohbet";

    const del =
      document.createElement("button");

    del.className = "delete-chat";

    del.textContent = "🗑️";

    del.onclick = event =>
      deleteChat(chat.id, event);

    item.appendChild(title);
    item.appendChild(del);

    list.appendChild(item);
  });
}

function renderMessages() {

  const container =
    document.getElementById("messages");

  container.innerHTML = "";

  const chat = getCurrentChat();

  if (!chat) return;

  if (chat.messages.length === 0) {

    const empty =
      document.createElement("div");

    empty.className = "empty";

    empty.textContent =
      "Merhaba! Ben MERT AI 🤖";

    container.appendChild(empty);

    return;
  }

  chat.messages.forEach(message => {

    const div =
      document.createElement("div");

    div.className =
      "message " +
      (message.role === "user"
        ? "user"
        : "ai");

    div.textContent =
      message.content;

    container.appendChild(div);
  });

  container.scrollTop =
    container.scrollHeight;
}

async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const button =
    document.getElementById("sendButton");

  const message =
    input.value.trim();

  if (!message) return;

  const chat = getCurrentChat();

  if (!chat) return;

  chat.messages.push({
    role: "user",
    content: message
  });

  if (
    chat.title === "Yeni Sohbet"
  ) {
    chat.title =
      message.slice(0, 25);
  }

  input.value = "";

  saveChats();
  renderChatList();
  renderMessages();

  button.disabled = true;
  button.textContent = "⏳";

  try {

    const response =
      await fetch(WORKER_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      });

    const data =
      await response.json();

    if (data.answer) {

      chat.messages.push({
        role: "assistant",
        content: data.answer
      });

    } else {

      chat.messages.push({
        role: "assistant",
        content:
          "Üzgünüm, cevap oluşturulamadı."
      });
    }

  } catch (error) {

    chat.messages.push({
      role: "assistant",
      content:
        "Bağlantı hatası oluştu."
    });
  }

  saveChats();
  renderMessages();

  button.disabled = false;
  button.textContent = "Gönder";
}

document
  .getElementById("messageInput")
  .addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
      sendMessage();
    }

  });

createFirstChat();
renderChatList();
renderMessages();

</script>

</body>
</html>
