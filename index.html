<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERT AI</title>

<style>
*{box-sizing:border-box}

html,body{
margin:0;
width:100%;
height:100%;
background:#000;
color:#fff;
font-family:Arial,sans-serif
}

#splash{
position:fixed;
inset:0;
background:#000;
z-index:9999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
animation:out 1s ease 2.5s forwards
}

.logo{
font-size:52px;
font-weight:900;
letter-spacing:6px;
text-shadow:0 0 10px #fff,0 0 25px #888;
animation:pulse 1s infinite alternate
}

#splash p{
color:#999
}

@keyframes pulse{
from{transform:scale(.95);opacity:.7}
to{transform:scale(1.05);opacity:1}
}

@keyframes out{
to{opacity:0;visibility:hidden;pointer-events:none}
}

.app{
height:100vh;
display:flex;
flex-direction:column
}

.header{
height:60px;
display:flex;
align-items:center;
justify-content:center;
border-bottom:1px solid #222;
font-size:22px;
font-weight:bold
}

#chat{
flex:1;
overflow-y:auto;
padding:20px 12px
}

.welcome{
text-align:center;
margin-top:70px
}

.welcome h1{
font-size:38px
}

.welcome p{
color:#888
}

.row{
display:flex;
margin:12px 0
}

.row.user{
justify-content:flex-end
}

.row.ai{
justify-content:flex-start
}

.message{
max-width:80%;
padding:13px 16px;
border-radius:18px;
line-height:1.5;
white-space:pre-wrap;
word-break:break-word
}

.user .message{
background:#202020;
border-bottom-right-radius:5px
}

.ai .message{
background:#0d0d0d;
border:1px solid #252525;
border-bottom-left-radius:5px
}

.input-area{
padding:10px 12px 16px;
border-top:1px solid #181818
}

.input-box{
max-width:850px;
margin:auto;
display:flex;
gap:8px;
background:#111;
border:1px solid #333;
border-radius:17px;
padding:6px
}

#messageInput{
flex:1;
min-width:0;
background:transparent;
border:0;
outline:0;
color:white;
padding:12px;
font-size:16px
}

#sendButton{
border:0;
border-radius:12px;
background:white;
color:black;
padding:0 18px;
font-weight:bold
}
</style>
</head>

<body>

<div id="splash">
<div class="logo">MERT AI</div>
<p>Yapay zekâ asistanın hazırlanıyor...</p>
</div>

<div class="app">

<div class="header">🤖 MERT AI</div>

<div id="chat">

<div id="welcome" class="welcome">
<h1>MERT AI</h1>
<p>Merhaba 👋 Sana nasıl yardımcı olabilirim?</p>
</div>

</div>

<div class="input-area">
<div class="input-box">

<input
id="messageInput"
type="text"
placeholder="MERT AI'ya bir şey sor..."
autocomplete="off">

<button id="sendButton">Gönder</button>

</div>
</div>

</div>

<script>

const WORKER_URL =
"https://mert-ai.j28jyc9rjt.workers.dev";

const input =
document.getElementById("messageInput");

const button =
document.getElementById("sendButton");

const chat =
document.getElementById("chat");

const welcome =
document.getElementById("welcome");

function addMessage(text,type){

if(welcome) welcome.remove();

const row=document.createElement("div");
row.className="row "+type;

const msg=document.createElement("div");
msg.className="message";
msg.textContent=text;

row.appendChild(msg);
chat.appendChild(row);

chat.scrollTop=chat.scrollHeight;

return msg;
}

async function sendMessage(){

const text=input.value.trim();

if(!text) return;

addMessage(text,"user");

input.value="";
button.disabled=true;
button.textContent="⏳";

const ai=addMessage("Düşünüyorum...","ai");

try{

const response=await fetch(WORKER_URL,{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:text
})
});

const data=await response.json();

if(data.answer){
ai.textContent=data.answer;
}else{
ai.textContent="Cevap alınamadı.";
}

}catch(error){

ai.textContent="Bağlantı hatası oluştu.";

}

button.disabled=false;
button.textContent="Gönder";

chat.scrollTop=chat.scrollHeight;
}

button.addEventListener("click",sendMessage);

input.addEventListener("keydown",(e)=>{
if(e.key==="Enter") sendMessage();
});

</script>

</body>
</html>
