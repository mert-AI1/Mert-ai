<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERT AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #050816, #111827, #1e1b4b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .app {
      width: 100%;
      max-width: 700px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 25px;
      padding: 25px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 38px;
    }

    .subtitle {
      text-align: center;
      color: #a5b4fc;
      margin: 8px 0 25px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border: none;
      outline: none;
      border-radius: 18px;
      padding: 18px;
      font-size: 17px;
      background: #020617;
      color: white;
      border: 1px solid #334155;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 14px 8px;
      font-size: 15px;
      cursor: pointer;
      background: #312e81;
      color: white;
    }

    button:hover {
      background: #4338ca;
    }

    .send {
      margin-top: 12px;
      width: 100%;
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      font-size: 18px;
      font-weight: bold;
    }

    #answer {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: #020617;
      border: 1px solid #334155;
      min-height: 70px;
      white-space: pre-wrap;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      .buttons {
        grid-template-columns: repeat(2, 1fr);
      }

      h1 {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>✦ MERT AI</h1>

    <div class="subtitle">
      Yapay zeka asistanın
    </div>

    <textarea id="message" placeholder="MERT AI'ya bir şey sor..."></textarea>

    <div class="buttons">
      <button onclick="startVoice()">🎤 Ses</button>
      <button onclick="choosePhoto()">📷 Fotoğraf</button>
      <button onclick="chooseFile()">📎 Dosya</button>
      <button onclick="clearChat()">🗑️ Temizle</button>
    </div>

    <button class="send" onclick="sendMessage()">
      ➤ Gönder
    </button>

    <div id="answer">
      Merhaba! Ben MERT AI. 🤖
    </div>

    <input type="file" id="photoInput" accept="image/*" hidden>
    <input type="file" id="fileInput" hidden>

  </div>

  <script>

    const WORKER_URL =
  "https://mert-ai.j28jyc9rjt.workers.dev";
   

    async function sendMessage() {

      const messageBox = document.getElementById("message");
      const answerBox = document.getElementById("answer");

      const message = messageBox.value.trim();

      if (!message) {
        answerBox.textContent = "Önce bir mesaj yaz. 🙂";
        return;
      }

      answerBox.textContent = "MERT AI düşünüyor... 🤔";

      try {

        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: message
          })
        });

        const data = await response.json();

        if (data.answer) {
          answerBox.textContent = data.answer;
        } else {
          answerBox.textContent =
            "Bir hata oluştu: " + (data.error || "Bilinmeyen hata");
        }

      } catch (error) {

        answerBox.textContent =
          "MERT AI'ya bağlanılamadı. Worker adresini kontrol et.";

      }
    }

    function clearChat() {
      document.getElementById("message").value = "";
      document.getElementById("answer").textContent =
        "Merhaba! Ben MERT AI. 🤖";
    }

    function choosePhoto() {
      document.getElementById("photoInput").click();
    }

    function chooseFile() {
      document.getElementById("fileInput").click();
    }

    function startVoice() {

      if (!("webkitSpeechRecognition" in window)) {
        alert("Bu tarayıcı sesli girişi desteklemiyor.");
        return;
      }

      const recognition = new webkitSpeechRecognition();

      recognition.lang = "tr-TR";
      recognition.start();

      recognition.onresult = function(event) {
        document.getElementById("message").value =
          event.results[0][0].transcript;
      };
    }

  </script>

</body>
</html>
