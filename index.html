<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERT AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;font-family:Arial,sans-serif;height:100vh}
.app{display:flex;height:100vh}
.sidebar{width:230px;background:#090909;border-right:1px solid #222;padding:12px}
.logo{text-align:center;font-size:24px;font-weight:bold;margin:12px}
button{cursor:pointer}
.new{width:100%;padding:12px;background:#171717;color:#fff;border:1px solid #333;border-radius:10px}
.chatlist{margin-top:12px}
.chat{padding:10px;background:#111;border-radius:9px;margin-bottom:6px;display:flex;justify-content:space-between}
.chat span{cursor:pointer;flex:1}
.del{background:none;border:0;color:#aaa}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{padding:16px;border-bottom:1px solid #222;font-size:21px;font-weight:bold}
.messages{flex:1;overflow:auto;padding:15px}
.msg{max-width:800px;margin:0 auto 12px;padding:13px;border-radius:13px;white-space:pre-wrap}
.user{background:#202020}
.ai{background:#0d0d0d;border:1px solid #222}
.input{display:flex;gap:8px;padding:10px;border-top:1px solid #222}
input{flex:1;background:#111;color:#fff;border:1px solid #333;border-radius:12px;padding:13px;font-size:16px}
.send{background:#fff;color:#000;border:0;border-radius:12px;padding:0 18px}
@media(max-width:600px){
.sidebar{width:150px}
.logo{font-size:18px}
.new{font-size:12px}
.header{font-size:18px}
}
</style>
</head>

<body>
<div class="app">

<aside class="sidebar">
<div class="logo">MERT AI</div>
<button class="new" onclick="newChat()">➕ Yeni Sohbet</button>
<div id="chatList" class="chatlist"></div>
</aside>

<main class="main">
<div class="header">🤖 MERT AI</div>
<div id="messages" class="messages"></div>

<div class="input">
<input id="input" placeholder="MERT AI'ya bir şey sor...">
<button class="send" onclick="send()">Gönder</button>
</div>
</main>

</div>

<script>
const WORKER_URL="https://mert-ai.j28jyc9rjt.workers.dev";

let chats=JSON.parse(localStorage.getItem("mertAI_chats")||"[]");
let current=localStorage.getItem("mertAI_current");

function save(){
localStorage.setItem("mertAI_chats",JSON.stringify(chats));
localStorage.setItem("mertAI_current",current);
}

function newChat(){
let c={id:Date.now(),title:"Yeni Sohbet",messages:[]};
chats.unshift(c);
current=c.id;
save();
render();
}

function get(){
return chats.find(x=>String(x.id)===String(current));
}

function del(id,e){
e.stopPropagation();
chats=chats.filter(x=>String(x.id)!==String(id));
if(!chats.length) newChat();
else{
current=chats[0].id;
save();
render();
}
}

function render(){
let list=document.getElementById("chatList");
list.innerHTML="";

chats.forEach(c=>{
let d=document.createElement("div");
d.className="chat";

let s=document.createElement("span");
s.textContent=c.title;
s.onclick=()=>{current=c.id;save();render()};

let b=document.createElement("button");
b.className="del";
b.textContent="🗑️";
b.onclick=e=>del(c.id,e);

d.append(s,b);
list.appendChild(d);
});

let box=document.getElementById("messages");
box.innerHTML="";
let c=get();
if(!c)return;

c.messages.forEach(m=>{
let d=document.createElement("div");
d.className="msg "+(m.role==="user"?"user":"ai");
d.textContent=m.content;
box.appendChild(d);
});

box.scrollTop=box.scrollHeight;
}

async function send(){
let input=document.getElementById("input");
let text=input.value.trim();
if(!text)return;

let c=get();
if(!c)return;

c.messages.push({role:"user",content:text});
if(c.title==="Yeni Sohbet")c.title=text.slice(0,25);

input.value="";
save();
render();

try{
let r=await fetch(WORKER_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:text})
});

let data=await r.json();

c.messages.push({
role:"assistant",
content:data.answer||"Cevap alınamadı."
});

}catch(e){
c.messages.push({
role:"assistant",
content:"Bağlantı hatası oluştu."
});
}

save();
render();
}

document.getElementById("input").addEventListener("keydown",e=>{
if(e.key==="Enter")send();
});

if(!chats.length){
let c={id:Date.now(),title:"Yeni Sohbet",messages:[]};
chats.push(c);
current=c.id;
}else if(!current){
current=chats[0].id;
}

save();
render();
</script>
</body>
</html>
