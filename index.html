<!-- MERT AI Giriş Animasyonu -->
<div id="splash">
  <div class="electric-logo">MERT AI</div>
  <h1>MERT AI</h1>
  <p>Yapay zekâ asistanın hazırlanıyor...</p>
</div>

<style>
#splash {
  position: fixed;
  inset: 0;
  background: #050505;
  color: white;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 9999;
  animation: splashOut 1s ease 2.5s forwards;
}

#splash .robot {
  font-size: 70px;
  <div class="electric-logo">MERT AI</div>
}

#splash h1 {
  font-size: 42px;
  margin: 15px 0 5px;
  letter-spacing: 4px;
}

#splash p {
  opacity: .7;
}

@keyframes robotPulse {
  from { transform: scale(.9); }
  to { transform: scale(1.1); }
}

@keyframes splashOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}
</style>
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERT AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0f17;
      color: white;
      height: 100vh;
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      max-width: 900px;
      margin: auto;
      background: #111722;
    }

    /* ÜST BAR */
    .header {
      height: 70px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #252c39;
      background: #111722;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: linear-gradient(135deg, #6d5dfc, #00c6ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      font-weight: bold;
    }

    .logo-text {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      color: #7d8798;
      margin-top: 3px;
    }

    .online {
      color: #35d07f;
    }

    /* MESAJLAR */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 16px 110px;
    }

    .welcome {
      text-align: center;
      margin-top: 15vh;
      color: #9aa4b5;
    }

    .welcome h1 {
      color: white;
      font-size: 30px;
      margin-bottom: 10px;
    }

    .welcome p {
      font-size: 14px;
    }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.ai {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 80%;
      padding: 13px 16px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .user .bubble {
      background: linear-gradient(135deg, #6758f5, #4b7bec);
      border-bottom-right-radius: 5px;
    }

    .ai .bubble {
      background: #1b2230;
      border: 1px solid #293142;
      border-bottom-left-radius: 5px;
    }

    /* YAZIYOR */
    .typing {
      display: none;
      margin-bottom: 15px;
    }

    .typing .bubble {
      color: #8e99aa;
    }

    /* ALT KUTU */
    .input-area {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, 100%);
      padding: 12px 14px 16px;
      background: linear-gradient(
        to top,
        #111722 75%,
        transparent
      );
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: #1a2130;
      border: 1px solid #30394a;
      border-radius: 20px;
      padding: 8px;
      box-shadow: 0 8px 30px rgba(0,0,0,.3);
    }

    textarea {
      flex: 1;
      resize: none;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      font-size: 15px;
      padding: 9px 5px;
      max-height: 120px;
      min-height: 40px;
      font-family: inherit;
    }

    textarea::placeholder {
      color: #788396;
    }

    .icon-btn,
    .send-btn {
      width: 42px;
      height: 42px;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 19px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: #252d3c;
      color: #c4ccda;
    }

    .send-btn {
      background: linear-gradient(135deg, #6d5dfc, #00a8ff);
      color: white;
      font-size: 18px;
    }

    .icon-btn:active,
    .send-btn:active {
      transform: scale(.94);
    }

    .tools {
      display: flex;
      gap: 6px;
    }

    @media (max-width: 600px) {
      .header {
        height: 62px;
      }

      .messages {
        padding-left: 12px;
        padding-right: 12px;
      }

      .bubble {
        max-width: 88%;
      }

      .welcome h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="logo">
      <div class="logo-icon">✦</div>

      <div>
        <div class="logo-text">MERT AI</div>
        <div class="status">
          <span class="online">●</span> Çevrimiçi
        </div>
      </div>
    </div>
  </header>

  <main class="messages" id="messages">

    <div class="welcome" id="welcome">
      <h1>Merhaba 👋</h1>
      <p>Ben MERT AI. Sana nasıl yardımcı olabilirim?</p>
    </div>

  </main>

  <div class="typing" id="typing">
    <div class="bubble">MERT AI yazıyor...</div>
  </div>

  <div class="input-area">

    <div class="input-box">

      <div class="tools">
        <button class="icon-btn" onclick="alert('Dosya özelliği yakında!')">📎</button>
      </div>

      <textarea
        id="messageInput"
        placeholder="MERT AI'ya mesaj yaz..."
        rows="1"
      ></textarea>

      <button
        class="icon-btn"
        onclick="alert('Sesli konuşma yakında!')"
      >🎤</button>

      <button
        class="send-btn"
        onclick="sendMessage()"
      >➤</button>

    </div>

  </div>

</div>

<script>

const WORKER_URL =
  "https://mert-ai.j28jyc9rjt.workers.dev";

const input = document.getElementById("messageInput");
const messages = document.getElementById("messages");
const welcome = document.getElementById("welcome");
const typing = document.getElementById("typing");

input.addEventListener("keydown", function(event) {

  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }

});

input.addEventListener("input", function() {

  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, 120) + "px";

});

function addMessage(text, type) {

  welcome.style.display = "none";

  const message = document.createElement("div");
  message.className = "message " + type;

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  message.appendChild(bubble);
  messages.appendChild(message);

  messages.scrollTop = messages.scrollHeight;
}

async function sendMessage() {

  const message = input.value.trim();

  if (!message) return;

  addMessage(message, "user");

  input.value = "";
  input.style.height = "auto";

  typing.style.display = "block";
  messages.appendChild(typing);

  messages.scrollTop = messages.scrollHeight;

  try {

    const response = await fetch(WORKER_URL, {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        message: message
      })

    });

    const data = await response.json();

    typing.style.display = "none";

    if (data.answer) {

      addMessage(data.answer, "ai");

    } else {

      addMessage(
        "Üzgünüm, şu anda cevap oluşturamadım.",
        "ai"
      );

    }

  } catch (error) {

    typing.style.display = "none";

    addMessage(
      "MERT AI'ya bağlanırken bir sorun oluştu.",
      "ai"
    );

  }

}

</script>

</body>
</html>
