<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MERT AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080b16;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .background {
      position: fixed;
      width: 100%;
      height: 100%;
      background:
        radial-gradient(circle at 20% 20%, #3155ff55, transparent 30%),
        radial-gradient(circle at 80% 80%, #9b27ff44, transparent 30%);
      z-index: -1;
    }

    .container {
      width: 92%;
      max-width: 850px;
      text-align: center;
    }

    .logo {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: 2px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #6ea8ff, #c77dff);
      -webkit-background-clip: text;
      color: transparent;
    }

    .subtitle {
      color: #aeb6d3;
      margin-bottom: 35px;
      font-size: 17px;
    }

    .chat-box {
      background: #111629cc;
      border: 1px solid #ffffff18;
      border-radius: 25px;
      padding: 15px;
      box-shadow: 0 20px 70px #00000066;
      backdrop-filter: blur(15px);
    }

    textarea {
      width: 100%;
      height: 130px;
      border: none;
      outline: none;
      resize: none;
      background: transparent;
      color: white;
      font-size: 17px;
      padding: 10px;
    }

    textarea::placeholder {
      color: #747c99;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 15px;
      padding: 13px 16px;
      color: white;
      background: #1d2440;
      font-size: 15px;
    }

    button:hover {
      background: #2b365e;
    }

    .send {
      margin-left: auto;
      background: linear-gradient(135deg, #4776ff, #9b4dff);
      font-weight: bold;
    }

    .welcome {
      margin-top: 25px;
      color: #8e97b7;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 38px;
      }

      .buttons {
        flex-wrap: wrap;
      }

      .send {
        margin-left: 0;
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <div class="background"></div>

  <main class="container">

    <div class="logo">✦ MERT AI</div>

    <p class="subtitle">
      Merhaba! Ben MERT AI. Sana nasıl yardımcı olabilirim?
    </p>

    <div class="chat-box">

      <textarea
        placeholder="MERT AI'ya bir şey sor..."
      ></textarea>

      <div class="buttons">
        <button>🎤 Ses</button>
        <button>📷 Fotoğraf</button>
        <button>📎 Dosya</button>
        <button class="send">➤ Gönder</button>
      </div>

    </div>

    <p class="welcome">
      MERT AI • Senin yapay zekâ asistanın
    </p>

  </main>

</body>
</html>
